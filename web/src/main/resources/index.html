<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KeyForge</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family:
                    -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu,
                    Cantarell, sans-serif;
            background: linear-gradient(135deg, #ffe4e1 0%, #ffb6c1 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(255, 182, 193, 0.3);
            max-width: 450px;
            width: 100%;
            border: 2px solid #ffb6c1;
        }

        h1 {
            color: #d4a5a5;
            margin-bottom: 30px;
            font-size: 32px;
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.05);
        }

        .input-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #b89292;
            font-weight: 500;
        }

        input[type="number"] {
            width: 100%;
            padding: 15px;
            border: 2px solid #ffb6c1;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s;
            background: #fff5f5;
            color: #8b6f6f;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: #ff69b4;
            box-shadow: 0 0 10px rgba(255, 182, 193, 0.5);
        }

        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #ffb6c1 0%, #ff69b4 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(255, 182, 193, 0.4);
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 105, 180, 0.5);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .password-display {
            margin-top: 25px;
            padding: 20px;
            background: #fff0f5;
            border-radius: 10px;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            border: 2px dashed #ffb6c1;
        }

        .password-text {
            font-family: "Courier New", monospace;
            font-size: 18px;
            color: #b89292;
            word-break: break-all;
            transition: all 0.4s ease;
            flex: 1;
            text-align: center;
            padding-right: 40px;
        }

        .copy-btn {
            position: absolute;
            right: 10px;
            top: 25%;
            transform: translateY(-25%);
            background: transparent;
            border: none;
            color: #ff69b4;
            cursor: pointer;
            font-size: 20px;
            padding: 5px 10px;
            transition: all 0.3s;
            width: auto;
        }

        .password-display:hover .copy-btn {
            opacity: 1;
        }

        .copy-btn:hover {
            transform: translateY(-25%) scale(1.1);
        }
    </style>
</head>
<body>
<div class="container">
    <h1>KeyForge</h1>
    <div class="input-group">
        <label for="length">Длина пароля</label>
        <input
                type="number"
                id="length"
                min="10"
                max="128"
                value="10"
                placeholder="Введите длину"
        >
    </div>
    <button onclick="generatePassword()">Сгенерировать пароль</button>
    <div class="password-display">
        <div class="password-text" id="password"></div>
        <button class="copy-btn" onclick="copyPassword()" title="Копировать">
            📋
        </button>
    </div>
</div>
</body>
<script>
    async function generatePassword() {
        let length = document.getElementById("length").value;

        const url = new URL("/generate", window.location.origin);
        const params = {
            length: length,
        };

        url.search = new URLSearchParams(params).toString();
        const response = await fetch(url);

        let passwordElement = document.getElementById("password");
        passwordElement.textContent = await response.text()
    }

    async function copyPassword() {
        let password = document.getElementById("password").textContent;
        try {
            await navigator.clipboard.writeText(password);
        } catch (err) {
            console.error("Ошибка при копировании: ", err);
        }
    }
</script>
</html>
